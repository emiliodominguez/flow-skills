name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

            - name: Validate skills
              run: pnpm run validate

            - name: Test
              run: pnpm run test

            - name: Format check
              run: pnpm run format:check

            - name: Docs are up to date
              run: |
                  pnpm run docs:gen
                  git diff --exit-code docs/SKILLS.md || {
                    echo "::error::docs/SKILLS.md is stale — run 'pnpm docs:gen' and commit the result."
                    exit 1
                  }
