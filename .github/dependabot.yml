version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # TypeScript 7 (the native compiler) is blocked upstream: typescript-eslint's peer
    # range is `typescript >=4.8.4 <6.1.0`, so type-aware linting can't run on TS 7 yet.
    # Remove this once typescript-eslint ships TS 7 support, then bump TS deliberately.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
