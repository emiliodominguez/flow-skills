name: release

# Changesets-driven. On every push to main: if changeset files are pending, open/update
# a "version packages" PR (bump version + CHANGELOG). When that PR merges (no pending
# changesets), publish to npm — but only when NPM_TOKEN is configured.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: "0"
  # Hoisted to workflow scope so the `with:` expression below can gate on it.
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          # Empty publish command until NPM_TOKEN exists → version-PR only, never a failed publish.
          publish: ${{ env.NPM_TOKEN != '' && 'pnpm run release' || '' }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
