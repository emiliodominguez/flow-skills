name: release

# Changesets-driven. On every push to main: if changeset files are pending, open/update
# a "version packages" PR (bump version + CHANGELOG). When that PR merges (no pending
# changesets), publish to npm — but only when NPM_TOKEN is configured.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # Verify before any publish can happen, so a red commit can't ship.
      - name: Verify
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run validate
          pnpm run test
      - run: pnpm run build
      # Pinned to a full commit SHA (supply-chain): this is the only step that sees the
      # npm token, and the token is scoped to this step's env — not the whole workflow.
      - name: Create version PR or publish
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v1
        with:
          version: pnpm run version:packages
          # Empty publish command until NPM_TOKEN exists → version-PR only, never a failed publish.
          publish: ${{ secrets.NPM_TOKEN != '' && 'pnpm run release' || '' }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
