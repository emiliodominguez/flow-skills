name: release

# Dormant while GitHub Actions is disabled at the repository level. If re-enabled, each push
# to main uses Changesets to open or update
# a "version packages" PR (bump version + CHANGELOG). When that PR merges (no pending
# changesets), publish to npm - but only when NPM_TOKEN is configured.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # Verify before any publish can happen, so a red commit can't ship.
      - name: Verify
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run validate
          pnpm run test
      - run: pnpm run build
      # Pinned to a full commit SHA (supply-chain): this is the only step that sees the
      # npm token, and the token is scoped to this step's env - not the whole workflow.
      - name: Create version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version:packages
          # Empty publish command until NPM_TOKEN exists → version-PR only, never a failed publish.
          publish-script: ${{ secrets.NPM_TOKEN != '' && 'pnpm run release' || '' }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
